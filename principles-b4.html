      <p class="page-desc">B4 · B. 可解析性 · 完整条目见 <a href="principles-affinity.html#principle-b4">亲和性原则汇总表</a>。</p>

    <section class="section" id="solution">
      <h2 id="design">设计侧改造建议</h2>
      <div class="surface-card principle-deliverable">1. 关键术语首次出现时使用 &lt;dfn&gt; 或脚注样式，而非仅靠鼠标悬浮显示</div>

      <h2 id="content-side">内容侧改造建议</h2>
      <div class="surface-card principle-deliverable">1. 悬浮内容同时以脚注或括号形式写入正文<br>2. 禁止仅用 title 属性承载关键定义</div>

      <h2 id="code-side">代码侧改造建议</h2>
      <div class="surface-card principle-deliverable">1. 管道检测 &lt;span title=&quot;...&quot;&gt;：若title长度&gt;20字符且正文无对应解释，则构建告警<br>2. 将 title 内容自动提取为尾注</div>
