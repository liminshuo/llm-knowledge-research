    <section class="section" id="solution">
      <h2 id="design">设计侧改造建议</h2>
      <div class="surface-card principle-deliverable">1. 标题字号/样式严格对应层级（H1最大→H6最小），视觉上不得跳级</div>

      <h2 id="content-side">内容侧改造建议</h2>
      <div class="surface-card principle-deliverable">1. H1→H2→H3→H4 逐级使用，不得跳级（如H1直接到H3）<br>2. 每个标题必须是明确的语义单元，写明&quot;对象+动作/结论&quot;<br>3. 禁止使用&quot;概述&quot;&quot;说明&quot;&quot;其他&quot;等空泛标题</div>

      <h2 id="code-side">代码侧改造建议</h2>
      <div class="surface-card principle-deliverable">1. 管道切分时以H2/H3为边界生成Chunk<br>2. CI检查标题层级是否跳级，发现则阻断构建</div>
